# Try the production image on this machine over plain http://localhost:8062.
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  popcorn:
    ports: !override
      - "8062:8000"
    environment:
      ALLOWED_HOSTS: localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: http://localhost:8062,http://127.0.0.1:8062
      BEHIND_PROXY: "false"
      SECURE_COOKIES: "false"
      # Sign in with just an email: no code, no email sent. Local testing only.
      DEV_LOGIN: "true"
    volumes:
      - ./data-local:/data
